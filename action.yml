name: 'KubeOpt Cost Scan'
description: 'Analyze Kubernetes costs across AKS, EKS, and GKE. Finds savings opportunities and posts a breakdown as a PR comment.'

branding:
  icon: trending-down
  color: green

inputs:
  kubeopt-url:
    description: 'URL of your KubeOpt instance (e.g. https://kubeopt.example.com). Leave blank to skip scan.'
    required: false
    default: ''
  kubeopt-username:
    description: 'KubeOpt username'
    required: false
    default: 'kubeopt'
  kubeopt-password:
    description: 'KubeOpt password'
    required: false
    default: ''
  cluster-id:
    description: 'Specific cluster ID to scan (omit for all clusters)'
    required: false
    default: ''
  top:
    description: 'Number of top opportunities to show'
    required: false
    default: '5'
  post-comment:
    description: 'Post results as PR comment (true/false)'
    required: false
    default: 'true'

outputs:
  total-savings:
    description: 'Total potential monthly savings in USD'
    value: ${{ steps.parse.outputs.total-savings }}
  scan-summary:
    description: 'Markdown summary of scan results'
    value: ${{ steps.parse.outputs.scan-summary }}

runs:
  using: composite
  steps:

    # ------------------------------------------------------------------ #
    # 1. Skip gracefully when no KubeOpt instance is configured
    # ------------------------------------------------------------------ #
    - name: Check configuration
      id: check
      shell: bash
      run: |
        if [ -z "${{ inputs.kubeopt-url }}" ] || [ -z "${{ inputs.kubeopt-password }}" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::KUBEOPT_URL or KUBEOPT_PASSWORD not configured -- skipping cost scan."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${{ inputs.kubeopt-url }}"
          echo "::add-mask::${{ inputs.kubeopt-password }}"
        fi

    # ------------------------------------------------------------------ #
    # 2. Set up Python using the action's own bundled requirements
    #    ${{ github.action_path }} resolves correctly whether called as
    #    `uses: ./` (same repo) or `uses: kubeopt/kubeopt@v1` (external).
    # ------------------------------------------------------------------ #
    - name: Set up Python
      if: steps.check.outputs.skip == 'false'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: ${{ github.action_path }}/requirements/requirements.txt

    - name: Install dependencies
      if: steps.check.outputs.skip == 'false'
      shell: bash
      run: |
        python -m pip install --upgrade pip --quiet
        pip install -r "${{ github.action_path }}/requirements/requirements.txt" --quiet

    # ------------------------------------------------------------------ #
    # 3. Run the cost scan and capture JSON output
    # ------------------------------------------------------------------ #
    - name: Run KubeOpt scan
      id: scan
      if: steps.check.outputs.skip == 'false'
      shell: bash
      env:
        KUBEOPT_URL:      ${{ inputs.kubeopt-url }}
        KUBEOPT_USERNAME: ${{ inputs.kubeopt-username }}
        KUBEOPT_PASSWORD: ${{ inputs.kubeopt-password }}
      run: |
        ARGS="--json --top ${{ inputs.top }}"
        if [ -n "${{ inputs.cluster-id }}" ]; then
          ARGS="$ARGS --cluster ${{ inputs.cluster-id }}"
        fi

        python "${{ github.action_path }}/cli.py" scan $ARGS \
          > /tmp/kubeopt_scan.json 2>/tmp/kubeopt_scan.err
        STATUS=$?

        if [ $STATUS -ne 0 ]; then
          echo "::error::KubeOpt scan failed. See below for details."
          cat /tmp/kubeopt_scan.err >&2
          exit 1
        fi

        echo "Scan completed successfully."

    # ------------------------------------------------------------------ #
    # 4. Parse JSON and produce markdown + step outputs
    # ------------------------------------------------------------------ #
    - name: Parse and format results
      id: parse
      if: steps.check.outputs.skip == 'false'
      shell: python
      run: |
        import json, os, sys, datetime

        SCAN_PATH = "/tmp/kubeopt_scan.json"
        try:
            with open(SCAN_PATH) as f:
                data = json.load(f)
        except Exception as e:
            print(f"::error::Could not parse scan output: {e}", file=sys.stderr)
            sys.exit(1)

        scan_date  = data.get("scan_date",          datetime.date.today().isoformat())
        total_sav  = data.get("total_savings",      0)
        clusters   = data.get("clusters",           [])
        opps       = data.get("opportunities",      [])

        if clusters:
            cluster_rows = "\n".join(
                f"| {c.get('cluster_id','--')} "
                f"| {c.get('provider','--')} "
                f"| ${c.get('monthly_cost', 0):,.0f} "
                f"| ${c.get('savings', 0):,.0f}/mo |"
                for c in clusters
            )
        else:
            cluster_rows = "| -- | -- | -- | -- |"

        if opps:
            opp_lines = "\n".join(
                f"{i}. ${opp.get('savings', 0):,.0f}/mo"
                f" -- {opp.get('cluster_id', '--')}"
                f" -- {opp.get('description', 'opportunity')}"
                for i, opp in enumerate(opps, 1)
            )
        else:
            opp_lines = "_No detailed opportunities returned._"

        total_fmt = f"{total_sav:,.0f}"

        md_lines = [
            f"## KubeOpt Cost Scan -- {scan_date}",
            "",
            "| Cluster | Provider | Monthly Spend | Savings Available |",
            "|---------|----------|--------------|-------------------|",
            cluster_rows,
            "",
            f"**Total potential savings: ${total_fmt}/mo**",
            "",
            "<details>",
            "<summary>Top opportunities</summary>",
            "",
            opp_lines,
            "",
            "</details>",
        ]
        md = "\n".join(md_lines)

        github_output = os.environ.get("GITHUB_OUTPUT", "")
        if github_output:
            delimiter = "KUBEOPT_MD_EOF"
            with open(github_output, "a") as out:
                out.write(f"total-savings={total_sav:.2f}\n")
                out.write(f"scan-summary<<{delimiter}\n{md}\n{delimiter}\n")

        print(f"Parsed. Total savings: ${total_fmt}/mo across {data.get('total_clusters', '?')} cluster(s).")

    # ------------------------------------------------------------------ #
    # 5. Write to GitHub Step Summary
    # ------------------------------------------------------------------ #
    - name: Write step summary
      if: always() && steps.check.outputs.skip == 'false'
      shell: python
      run: |
        import json, os, sys, datetime

        SCAN_PATH = "/tmp/kubeopt_scan.json"
        summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
        if not summary_path:
            sys.exit(0)

        if not os.path.exists(SCAN_PATH):
            with open(summary_path, "a") as f:
                f.write("## KubeOpt Cost Scan\n\n_Scan did not produce output -- check logs._\n")
            sys.exit(0)

        try:
            with open(SCAN_PATH) as f:
                data = json.load(f)
        except Exception as e:
            with open(summary_path, "a") as f:
                f.write(f"## KubeOpt Cost Scan\n\n_Could not parse output: {e}_\n")
            sys.exit(0)

        scan_date = data.get("scan_date",     datetime.date.today().isoformat())
        total_sav = data.get("total_savings", 0)
        clusters  = data.get("clusters",      [])
        opps      = data.get("opportunities", [])

        cluster_rows = "\n".join(
            f"| {c.get('cluster_id','--')} | {c.get('provider','--')} "
            f"| ${c.get('monthly_cost', 0):,.0f} | ${c.get('savings', 0):,.0f}/mo |"
            for c in clusters
        ) or "| -- | -- | -- | -- |"

        opp_lines = "\n".join(
            f"{i}. ${opp.get('savings', 0):,.0f}/mo -- {opp.get('cluster_id','--')} -- {opp.get('description','opportunity')}"
            for i, opp in enumerate(opps, 1)
        ) or "_No detailed opportunities returned._"

        md = "\n".join([
            f"## KubeOpt Cost Scan -- {scan_date}",
            "",
            "| Cluster | Provider | Monthly Spend | Savings Available |",
            "|---------|----------|--------------|-------------------|",
            cluster_rows,
            "",
            f"**Total potential savings: ${total_sav:,.0f}/mo**",
            "",
            "<details><summary>Top opportunities</summary>",
            "",
            opp_lines,
            "",
            "</details>",
        ])

        with open(summary_path, "a") as f:
            f.write(md + "\n")

    # ------------------------------------------------------------------ #
    # 6. Post PR comment
    # ------------------------------------------------------------------ #
    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request' && steps.check.outputs.skip == 'false'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          let data;
          try {
            data = JSON.parse(fs.readFileSync('/tmp/kubeopt_scan.json', 'utf8'));
          } catch (e) {
            core.warning('Could not read scan output for PR comment: ' + e.message);
            return;
          }

          const scanDate = data.scan_date    || new Date().toISOString().split('T')[0];
          const totalSav = data.total_savings || 0;
          const clusters = data.clusters      || [];
          const opps     = data.opportunities || [];

          const fmt = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });

          const clusterRows = clusters.length
            ? clusters.map(c =>
                `| ${c.cluster_id || '--'} | ${c.provider || '--'} | $${fmt(c.monthly_cost)} | $${fmt(c.savings)}/mo |`
              ).join('\n')
            : '| -- | -- | -- | -- |';

          const oppLines = opps.length
            ? opps.map((o, i) => `${i+1}. $${fmt(o.savings)}/mo -- ${o.cluster_id || '--'} -- ${o.description || 'opportunity'}`).join('\n')
            : '_No detailed opportunities returned._';

          const body = [
            `## KubeOpt Cost Scan -- ${scanDate}`,
            '',
            '| Cluster | Provider | Monthly Spend | Savings Available |',
            '|---------|----------|--------------|-------------------|',
            clusterRows,
            '',
            `**Total potential savings: $${fmt(totalSav)}/mo**`,
            '',
            '<details>',
            '<summary>Top opportunities</summary>',
            '',
            oppLines,
            '',
            '</details>',
            '',
            '---',
            '_Powered by [KubeOpt](https://github.com/kubeopt/kubeopt) -- Kubernetes cost intelligence_',
          ].join('\n');

          const MARKER = '## KubeOpt Cost Scan';

          const { data: comments } = await github.rest.issues.listComments({
            owner:        context.repo.owner,
            repo:         context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

          if (existing) {
            await github.rest.issues.updateComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              comment_id: existing.id,
              body,
            });
            core.info('Updated existing KubeOpt PR comment.');
          } else {
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info('Created new KubeOpt PR comment.');
          }
